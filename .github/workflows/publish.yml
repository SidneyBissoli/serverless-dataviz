name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  # Allow manual re-runs from the Actions tab.
  workflow_dispatch:

# Least-privilege token scoped for Pages deployment via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer run cancel an in-flight one, but never abort an actual deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # The document uses engine: knitr, so R + knitr must exist at render time.
      # The {webr} cells are NOT evaluated here — they run in the browser — so
      # only knitr is needed (no dplyr/ggplot2/scales in CI). use-public-rspm
      # pulls a precompiled knitr binary instead of compiling from source.
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install knitr
        run: install.packages("knitr")
        shell: Rscript {0}

      - name: Render site
        run: quarto render --output-dir _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
